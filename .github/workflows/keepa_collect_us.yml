name: Keepa Collect US

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  collect-us:
    name: Collect US Products
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # Ranking取得
      # =========================
      - name: Fetch US ranking ASINs
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          OUT_FILE: asins_us_ranking.json
          QUERY_TITLE: protein powder
        run: |
          python scripts/fetch_ranking_asins_us.py

      - name: Debug US ranking ASIN file
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("asins_us_ranking.json")
          print("[DEBUG] exists:", p.exists())
          data = json.loads(p.read_text())
          print("[DEBUG] type:", type(data).__name__)
          if isinstance(data, list):
              print("[DEBUG] count:", len(data))
              print("[DEBUG] sample:", data[:10])
          PY

      - name: Import US ranking ASINs to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ASIN_FILE: asins_us_ranking.json
          CATEGORY: protein
          LOCALE: us
          SOURCE: ranking
        run: |
          python scripts/import_asins_to_supabase.py

      # =========================
      # BestSeller取得（カテゴリID指定）
      # =========================
      - name: Fetch US best seller ASINs
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: "6973717011"
          OUT_FILE: asins_us_bestsellers.json
        run: |
          python scripts/fetch_best_sellers_asins_us.py

      - name: Debug US best seller ASIN file
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("asins_us_bestsellers.json")
          print("[DEBUG] exists:", p.exists())
          data = json.loads(p.read_text())
          print("[DEBUG] type:", type(data).__name__)
          if isinstance(data, list):
              print("[DEBUG] count:", len(data))
              print("[DEBUG] sample:", data[:10])
          PY

      - name: Import US best seller ASINs to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ASIN_FILE: asins_us_bestsellers.json
          CATEGORY: protein
          LOCALE: us
          SOURCE: bestsellers
        run: |
          python scripts/import_asins_to_supabase.py

      # =========================
      # Tracking（rankingベース）
      # =========================
      - name: Add Keepa tracking for US ASINs
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          MAIN_DOMAIN_ID: "1"
          MAX_TRACKING: "50"
          IN_FILE: asins_us_ranking.json
        run: |
          python scripts/add_tracking.py

      # =========================
      # 商品詳細取得
      # =========================
      - name: Fetch US product details from Supabase & Keepa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          MAX_PER_RUN: "40"
        run: |
          python scripts/fetch_product_details_from_supabase_us.py