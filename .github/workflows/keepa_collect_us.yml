name: Keepa Collect US

on:
  schedule:
    # 1日4回（Plan20前提・USは少し軽め）
    # JST: 03:00 / 09:00 / 15:00 / 21:00
    - cron: "0 18 * * *"   # 03:00 JST
    - cron: "0 0 * * *"    # 09:00 JST
    - cron: "0 6 * * *"    # 15:00 JST
    - cron: "0 12 * * *"   # 21:00 JST
  workflow_dispatch:

jobs:
  collect-us:
    name: Collect US Products
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ① リポジトリ取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # ② Python セットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ③ 依存関係インストール
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ④ US データ取得 & 保存
      - name: Fetch US product details from Supabase & Keepa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          MAX_PER_RUN: "40"   # USはデータ重めなので控えめ
        run: |
          python scripts/fetch_product_details_from_supabase_us.py
