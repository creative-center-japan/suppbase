name: Keepa Collect US

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  collect-us:
    name: Collect US Products
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Check pwd
        run: pwd

      - name: Check files in root
        run: ls -la

      - name: Check files recursive
        run: find . -maxdepth 3 -type f | sort

      - name: Set ENV
        run: |
          echo "DOMAIN_ID=2" >> $GITHUB_ENV
          echo "LOCALE=us" >> $GITHUB_ENV
          echo "CATEGORY=wpi" >> $GITHUB_ENV
          echo "CATEGORY_ID=6973717011" >> $GITHUB_ENV
          echo "ASIN_FILE=asins_us_bestsellers.json" >> $GITHUB_ENV
          echo "OUT_FILE=asins_us_bestsellers.json" >> $GITHUB_ENV
          echo "MAX_PER_RUN=40" >> $GITHUB_ENV
          echo "RETRY=3" >> $GITHUB_ENV
          echo "SLEEP=60" >> $GITHUB_ENV

      - name: Fetch ASINs
        run: python scripts/fetch_best_sellers_asins_us.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      - name: Show fetched ASIN file
        run: |
          echo "==== asins_us_bestsellers.json ===="
          if [ -f "asins_us_bestsellers.json" ]; then
            cat asins_us_bestsellers.json
          else
            echo "asins_us_bestsellers.json not found"
          fi

      - name: Import ASINs
        run: python scripts/import_asins_to_supabase_us.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

      - name: Fetch product details
        run: python scripts/fetch_product_details_from_supabase_us.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}