name: Keepa Collect US

on:
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  collect-us:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests supabase

      # ★ここが重要（環境変数）
      - name: Set ENV
        run: |
          echo "DOMAIN_ID=2" >> $GITHUB_ENV
          echo "LOCALE=us" >> $GITHUB_ENV
          echo "CATEGORY=wpi" >> $GITHUB_ENV
          echo "CATEGORY_ID=6973717011" >> $GITHUB_ENV

      # ★ASIN取得
      - name: Fetch ASINs
        run: python fetch_best_sellers_asins_us.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      # ★Supabase登録
      - name: Import ASINs
        run: python import_asins_to_supabase_us.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ASIN_FILE: asins_us_bestsellers.json

      # ★商品詳細取得（ここが重要）
      - name: Fetch product details
        run: python fetch_product_details_from_supabase_us.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}