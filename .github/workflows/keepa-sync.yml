name: Keepa → Supabase sync

on:
  workflow_dispatch: {}
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil psycopg2-binary supabase

      - name: Run fetch_keepa.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa.py

      # ★ 追加：ASINリストから product_details.json と supplement_product_details.json を生成
      - name: Build product_details.json from ASIN list
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_product_details.py
          ls -la

      - name: Run import_to_Supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/import_to_Supabase.py
