name: Keepa → Supabase sync

on:
  workflow_dispatch: {}
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil psycopg2-binary supabase

      - name: Prepare data dir
        run: mkdir -p data

      # --- プロテイン（既存ロジック）
      - name: Run fetch_keepa.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa.py

      # --- 以前のチェックポイントがあれば取得（なければ無視）
      - name: Download supplement checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: asins-supplements-jp
          path: data
        continue-on-error: true

      # --- サプリASIN収集（途中再開・しきい値・時間/ページ制限）
      - name: Run fetch_keepa_supplement.py (resume friendly)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages 300 \
            --max-minutes 45 \
            --checkpoint data/supplement_asins.progress.json \
            --min-rating 3.8 \
            --min-reviews 40 \
            --out data/supplement_asins.json

      # --- チェックポイントをアップロード（次回再開用）
      - name: Upload supplement checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: asins-supplements-jp
          path: |
            data/supplement_asins.json
            data/supplement_asins.progress.json

      # --- 以前の「詳細」チェックポイントがあれば取得（任意）
      - name: Download details checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: details-supplements-jp
          path: data
        continue-on-error: true

      # --- 詳細データ作成（プロテイン + サプリ）
      - name: Build product_details.json from ASIN list
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          echo "▶ プロテイン詳細"
          python scripts/fetch_product_details.py

          echo "▶ サプリ詳細（BCAA/EAAなどは詳細側でフィルタ）"
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file data/supplement_asins.json \
            --out supplement_product_details.json \
            --checkpoint data/supplement_details.progress.json \
            --max-asins 600 \
            --max-minutes 40 \
            --batch-size 100

          ls -la

      # --- 詳細フェーズのチェックポイントも保存（任意）
      - name: Upload details checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: details-supplements-jp
          path: |
            data/supplement_details.progress.json
            supplement_product_details.json

      # --- Supabase へ取り込み
      - name: Run import_to_Supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/import_to_Supabase.py
