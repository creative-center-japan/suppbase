name: Keepa → Supabase sync

on:
  workflow_dispatch: {}
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil psycopg2-binary supabase

      - name: Run fetch_keepa.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa.py

      # ★ 追加：fetch の出力を import 側の想定名に揃える
      - name: Normalize filenames
        run: |
          set -eux
          ls -la || true
          ls -la scripts || true

          # protein_asins_deals_filtered.json → product_details.json に統一
          if [ -f protein_asins_deals_filtered.json ]; then
            mv protein_asins_deals_filtered.json product_details.json
          elif [ -f scripts/protein_asins_deals_filtered.json ]; then
            mv scripts/protein_asins_deals_filtered.json product_details.json
          fi

          # まだ存在しない補助ファイルは空配列で用意（スクリプトを通すため）
          if [ ! -f supplement_product_details.json ]; then
            echo "[]" > supplement_product_details.json
          fi

          echo "--- after normalize ---"
          ls -la

      - name: Run import_to_Supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/import_to_Supabase.py
