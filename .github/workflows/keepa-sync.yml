name: Keepa → Supabase sync

on:
  workflow_dispatch: {}
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil psycopg2-binary supabase

      - name: Prepare data dir
        run: |
          mkdir -p data

      # 既存の supplement ASIN / details のチェックポイントを（あれば）ダウンロード
      - name: Download supplement checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: asins-supplements-jp
          path: data
        continue-on-error: true

      - name: Download details checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: details-supplements-jp
          path: data
        continue-on-error: true

      # --- プロテイン（従来どおり）
      - name: Run fetch_keepa.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa.py

      # --- サプリ（再開対応・しきい値付き）
      - name: Run fetch_keepa_supplement.py (resume friendly)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          # 日本のマーケットで BCAA/EAA を穏やかに取得（必要に応じて数値調整OK）
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages 300 \
            --max-minutes 45 \
            --checkpoint data/supplement_asins.json \
            --min-rating 3.8 \
            --min-reviews 40

      - name: Upload supplement checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: asins-supplements-jp
          path: data/supplement_asins.json
          retention-days: 7

      # --- 詳細データ（ASIN→詳細）: 途中再開 & 制限
      - name: Build product_details.json from ASIN list
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          echo "▶ プロテイン詳細"
          python scripts/fetch_product_details.py

          echo "▶ サプリ詳細（BCAA/EAA などは時間制限でフィルタ）"
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file data/supplement_asins.json \
            --out data/supplement_product_details.json \
            --checkpoint data/supplement_details_progress.json \
            --max-asins 600 \
            --max-minutes 40 \
            --batch-size 100
          ls -la data

      - name: Upload details checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: details-supplements-jp
          path: |
            data/supplement_details_progress.json
            data/supplement_product_details.json
          retention-days: 7

      # --- Supabase へ取り込み
      - name: Run import_to_Supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/import_to_Supabase.py
