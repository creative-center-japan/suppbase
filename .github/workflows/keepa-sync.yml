name: Keepa to Supabase sync

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages for /deal"
        required: false
        default: "250"
      max_minutes:
        description: "Max minutes per scrape job"
        required: false
        default: "60"
  schedule:
    - cron: "0 17 * * *" # JST 02:00（UTC 17:00）

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MAX_PAGES: ${{ inputs.max_pages || '250' }}
  MAX_MINUTES: ${{ inputs.max_minutes || '60' }}

jobs:
  protein:
    name: Scrape Protein deals & details
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase
      - name: Prepare data dir
        run: mkdir -p data
      - name: Run fetch_filtered_deals.py (protein /deal → ASIN + priceDrops)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_filtered_deals.py
      - name: Build protein details (product stats/rating)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LIST_FILE: protein_asins_deals_filtered.json
          OUT_PRODUCT: product_details.json
        run: |
          python scripts/fetch_product_details.py
      - name: Upload artifacts (protein)
        uses: actions/upload-artifact@v4
        with:
          name: protein-json
          path: |
            protein_asins_deals_filtered.json
            product_details.json
            data/deal_price_drops_protein.json
          if-no-files-found: warn

  supplements:
    name: Scrape Supplements deals & details
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase
      - name: Prepare data dir
        run: mkdir -p data
      - name: Resume-able fetch_keepa_supplement.py (ASIN + priceDrops)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages $MAX_PAGES \
            --max-minutes $MAX_MINUTES \
            --checkpoint data/asins_supplements_jp.json \
            --min-rating 3.8 \
            --min-reviews 40
      - name: Build supplement details
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file data/asins_supplements_jp.json \
            --out supplement_product_details.json \
            --max-asins 800 \
            --max-minutes $MAX_MINUTES
      - name: Upload artifacts (supplements)
        uses: actions/upload-artifact@v4
        with:
          name: supplement-json
          path: |
            data/asins_supplements_jp.json
            data/deal_price_drops_supplements.json
            supplement_product_details.json
          if-no-files-found: warn

  import-and-score:
    name: Import to Supabase & update score (API only)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [protein, supplements]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Download protein artifacts
        uses: actions/download-artifact@v4
        with:
          name: protein-json
          path: .

      - name: Download supplement artifacts
        uses: actions/download-artifact@v4
        with:
          name: supplement-json
          path: .

      - name: Show files (debug)
        run: |
          set -euxo pipefail
          echo "== pwd ==" && pwd
          echo "== repo root ==" && ls -al
          echo "== scripts dir ==" && (ls -al scripts || true)
          echo "== data dir ==" && (ls -al data || true)

      - name: Import to Supabase (UPSERT + droprate=priceDrops + diff)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python scripts/import_to_Supabase.py

      - name: Compute & update score via Supabase API (no psql)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python - <<'PY'
          import math, sys, time
          from supabase import create_client
          import os
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_ROLE"]
          sb = create_client(url, key)

          # 1) まず min/max を取る（空テーブル耐性あり）
          def agg(col, fn):
            # min/max を安全に取得（NULL除外）
            order = {"min": True, "max": False}[fn]
            q = sb.table("products").select(col).neq(col, None).order(col, ascending=order).limit(1).execute()
            return (q.data[0][col] if q.data else None)

          min_drop = agg("droprate", "min"); max_drop = agg("droprate", "max")
          min_rank = agg("salesrank", "min"); max_rank = agg("salesrank", "max")
          min_rev  = agg("reviewcount", "min"); max_rev  = agg("reviewcount", "max")
          min_rt   = agg("rating", "min");     max_rt   = agg("rating", "max")

          # 正規化ヘルパ
          def norm(x, lo, hi, invert=False, fallback=None):
            if x is None:
              x = fallback
            if lo is None or hi is None or lo == hi or x is None:
              return 0.0
            v = (x - lo) / float(hi - lo)
            v = max(0.0, min(1.0, v))
            return (1.0 - v) if invert else v

          # 2) 全行をページングで取り出して score を計算→バルク upsert
          page = 0
          page_size = 1000
          total_updated = 0
          while True:
            res = sb.table("products").select(
              "asin, droprate, salesrank, reviewcount, rating"
            ).range(page*page_size, page*page_size + page_size - 1).execute()
            items = res.data or []
            if not items: break
            updates = []
            for p in items:
              n_drop = norm(p.get("droprate"),   min_drop, max_drop, invert=False)
              n_rank = norm(p.get("salesrank"),  min_rank, max_rank, invert=True,  fallback=max_rank)
              n_rev  = norm(p.get("reviewcount"),min_rev,  max_rev,  invert=False, fallback=0)
              n_rt   = norm(p.get("rating"),     min_rt,   max_rt,   invert=False, fallback=0)
              score = round(100.0*(0.40*n_drop + 0.30*n_rank + 0.20*n_rev + 0.10*n_rt), 1)
              updates.append({"asin": p["asin"], "score": score})
            if updates:
              sb.table("products").upsert(updates, on_conflict="asin").execute()
              total_updated += len(updates)
            page += 1
          print(f"updated scores: {total_updated}")

          # 3) 任意：30日以内のみの “最新” フラグを付ける（ビュー代替）
          #    front側で updated_at >= now()-30d を使えるなら不要。
          PY
