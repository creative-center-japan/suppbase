name: Keepa → Supabase sync

on:
  workflow_dispatch: {}
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil psycopg2-binary supabase

      - name: Prepare data dir
        run: mkdir -p data

      # ===== プロテイン ASIN 収集 =====
      - name: Run fetch_keepa.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python scripts/fetch_keepa.py

      # プロテインASINを固定名に集約（空なら即エラー）
      - name: Prepare protein asin list
        run: |
          set -eux
          if [ -f protein_asins_deals_filtered.json ]; then
            mv protein_asins_deals_filtered.json data/asins_protein_jp.json
          elif [ -f scripts/protein_asins_deals_filtered.json ]; then
            mv scripts/protein_asins_deals_filtered.json data/asins_protein_jp.json
          fi
          test -s data/asins_protein_jp.json || { echo "ASIN list empty: data/asins_protein_jp.json"; exit 1; }

      # ★ Python ワンライナーで件数を確認
      - name: Debug protein asin count
        run: |
          python -c "import json; print('protein asins count =', len(json.load(open('data/asins_protein_jp.json','r',encoding='utf-8'))))"

      # ===== サプリメント ASIN 収集（途中再開OK） =====
      - name: Download supplement checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: asins-supplements-jp
          path: data
        continue-on-error: true

      - name: Run fetch_keepa_supplement.py (resume friendly)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages 300 \
            --max-minutes 45 \
            --checkpoint data/asins_supplements_jp.json \
            --min-rating 3.8 \
            --min-reviews 40

      - name: Upload supplement checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: asins-supplements-jp
          path: data/asins_supplements_jp.json
          overwrite: true
          if-no-files-found: ignore

      # ★ サプリASINの件数をログ（空配列かどうか見える化）
      - name: Debug supplement asin count
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path('data/asins_supplements_jp.json')
          if not p.exists():
              print("supplement asin file: MISSING")
              sys.exit(0)
          try:
              arr = json.load(p.open(encoding='utf-8'))
              print("supplement asins count =", len(arr))
              print("is_empty_array =", (isinstance(arr, list) and len(arr)==0))
          except Exception as e:
              print("supplement asin file: INVALID:", e)
          PY

      # ===== 詳細情報フェッチ（途中再開OK） =====
      - name: Download details checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: details-supplements-jp
          path: data
        continue-on-error: true

      - name: Inspect data dir
        run: |
          echo "== data content ==" && ls -la data || true
          echo "== head json =="; for f in data/*.json; do echo "--- $f"; head -n 3 "$f" || true; done

      # プロテイン詳細（必ず実行）
      - name: Build product_details.json from protein ASIN list
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LIST_FILE: data/asins_protein_jp.json
          OUT_PRODUCT: product_details.json
          OUT_SUPP_PRODUCT: supplement_product_details.json
        run: |
          echo "▶ プロテイン詳細"
          python scripts/fetch_product_details.py
          ls -la product_details.json

      # サプリ詳細（ASINが「存在し」かつ「[] ではない」時のみ実行）
      - name: Build supplement_product_details.json (conditional)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          set -e
          if [ -f data/asins_supplements_jp.json ] \
            && ! grep -E '^[[:space:]]*\[[[:space:]]*\][[:space:]]*$' -q data/asins_supplements_jp.json; then
            echo "▶ サプリ詳細: data/asins_supplements_jp.json を処理します"
            python scripts/fetch_supplement_product_details.py \
              --market jp \
              --asin-file data/asins_supplements_jp.json \
              --out supplement_product_details.json \
              --checkpoint data/supplement_details_progress.json \
              --max-asins 600 \
              --max-minutes 40 \
              --batch-size 100
          else
            echo "▶ サプリ詳細: ASINファイルが空/未生成のためスキップ（空JSONを作成）"
            echo "[]" > supplement_product_details.json
          fi
          ls -la supplement_product_details.json || true

      - name: Upload details checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: details-supplements-jp
          path: |
            data/supplement_details_progress.json
            supplement_product_details.json
          overwrite: true
          if-no-files-found: ignore

      # ===== Supabase へ取り込み =====
      - name: Run import_to_Supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/import_to_Supabase.py
