name: Keepa → Supabase sync

on:
  workflow_dispatch: {}
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil psycopg2-binary supabase tqdm

      # ========= 可用チェックポイントの取得（無くても継続） =========
      - name: Download supplement checkpoint (if exists)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: asins-supplements-jp
          path: data

      - name: Download details checkpoint (if exists)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: details-progress
          path: data

      # ========= プロテイン（従来の収集） =========
      - name: Run fetch_keepa.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa.py

      # ========= サプリメント（再開可能・制限つき収集） =========
      - name: Run fetch_keepa_supplement.py (resume friendly)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          # 例：日本マーケット向け。必要に応じて引数を調整してください
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages 300 \
            --max-minutes 45 \
            --checkpoint data/asins_supplements_jp.json \
            --min-rating 3.8 \
            --min-reviews 40

      # 途中成果（ASINリスト）の保存
      - name: Upload supplement checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: asins-supplements-jp
          path: data/asins_supplements_jp.json
          if-no-files-found: ignore

      # ========= 詳細データ構築（再開可） =========
      - name: Build product_details.json from ASIN list
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          # プロテイン詳細
          python scripts/fetch_product_details.py \
            --market jp \
            --asin-file data/product_asins.json \
            --out product_details.json \
            --max-asins 600 \
            --batch-size 100

          # サプリ詳細（進捗再開つき）
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file data/supplement_asins.json \
            --out supplement_product_details.json \
            --checkpoint data/supplement_details_progress.json \
            --max-asins 600 \
            --max-minutes 40 \
            --batch-size 100

          ls -la

      # 詳細ビルドの進捗チェックポイント保存
      - name: Upload details checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: details-progress
          path: data/supplement_details_progress.json
          if-no-files-found: ignore

      # ========= Supabase 取り込み =========
      - name: Run import_to_Supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/import_to_Supabase.py
