name: Keepa to Supabase sync

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages for /deal"
        required: false
        default: "250"
      max_minutes:
        description: "Max minutes per scrape job"
        required: false
        default: "60"
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MAX_PAGES: ${{ inputs.max_pages || '250' }}
  MAX_MINUTES: ${{ inputs.max_minutes || '60' }}

jobs:
  protein:
    name: Scrape Protein deals & details
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
            python -m pip install --upgrade pip
            pip install "supabase>=2.4.0" requests

      - name: Prepare data dir
        run: |
          mkdir -p data

      - name: Run fetch_filtered_deals.py (protein /deal → ASIN + priceDrops)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_filtered_deals.py
        # generates:
        #   - protein_asins_deals_filtered.json
        #   - data/deal_price_drops_protein.json

      - name: Build protein details (product stats/rating)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LIST_FILE: protein_asins_deals_filtered.json
          OUT_PRODUCT: product_details.json
        run: |
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file "${ASIN_LIST_FILE}" \
            --out "${OUT_PRODUCT}" \
            --max-asins 800 \
            --max-minutes $MAX_MINUTES

      - name: Upload artifacts (protein)
        uses: actions/upload-artifact@v4
        with:
          name: protein-json
          path: |
            protein_asins_deals_filtered.json
            product_details.json
            data/deal_price_drops_protein.json
          if-no-files-found: warn

  supplements:
    name: Scrape Supplements deals & details
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "supabase>=2.4.0" requests

      - name: Prepare data dir
        run: |
          mkdir -p data

      - name: Resume-able fetch_keepa_supplement.py (ASIN + priceDrops)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages $MAX_PAGES \
            --max-minutes $MAX_MINUTES \
            --checkpoint data/asins_supplements_jp.json \
            --min-rating 3.8 \
            --min-reviews 40
        # generates:
        #   - data/asins_supplements_jp.json
        #   - data/deal_price_drops_supplements.json

      - name: Build supplement details
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file data/asins_supplements_jp.json \
            --out "supplement_product_details.json" \
            --max-asins 800 \
            --max-minutes $MAX_MINUTES

      - name: Upload artifacts (supplements)
        uses: actions/upload-artifact@v4
        with:
          name: supplement-json
          path: |
            data/asins_supplements_jp.json
            data/deal_price_drops_supplements.json
            supplement_product_details.json
          if-no-files-found: warn

  import-and-score:
    name: Import to Supabase & update score (REST)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [protein, supplements]

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "supabase>=2.4.0" requests

      - name: Download protein artifacts
        uses: actions/download-artifact@v4
        with:
          name: protein-json
          path: .

      - name: Download supplement artifacts
        uses: actions/download-artifact@v4
        with:
          name: supplement-json
          path: .

      - name: Show files (debug)
        run: |
          set -euxo pipefail
          echo "== pwd ==" && pwd
          echo "== repo root ==" && ls -al
          echo "== data dir ==" && (ls -al data || true)

      - name: Import to Supabase (UPSERT + droprate=priceDrops + diff) via supabase-py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python scripts/import_to_Supabase.py

      - name: Compute & update score via Supabase API (no psql)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python - <<'PY'
          import os
          from math import isfinite
          from typing import List, Dict, Optional
          from supabase import create_client

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_ROLE"]
          supa = create_client(url, key)

          # 1) pull all needed fields in pages
          page = 0
          size = 1000
          rows: List[dict] = []
          while True:
              resp = supa.table("products").select(
                  "asin, droprate, salesrank, reviewcount, rating"
              ).range(page*size, page*size + size - 1).execute()
              batch = resp.data or []
              if not batch:
                  break
              rows.extend(batch)
              if len(batch) < size:
                  break
              page += 1

          # if nothing to do, exit early
          if not rows:
              print("updated scores: 0 (no rows)")
              raise SystemExit(0)

          # 2) compute global min/max ignoring NULLs
          def _vals(col: str):
              vals = [r[col] for r in rows if r.get(col) is not None]
              return vals if vals else []

          def _min(vals): return min(vals) if vals else None
          def _max(vals): return max(vals) if vals else None

          drops = _vals("droprate")
          ranks = _vals("salesrank")
          revs  = _vals("reviewcount")
          rats  = _vals("rating")

          min_drop, max_drop = _min(drops), _max(drops)
          min_rank, max_rank = _min(ranks), _max(ranks)
          min_rev,  max_rev  = _min(revs),  _max(revs)
          min_rt,   max_rt   = _min(rats),  _max(rats)

          def norm(x: Optional[float], lo: Optional[float], hi: Optional[float], invert=False, fallback: float = 0.0) -> float:
              if x is None or (lo is None) or (hi is None) or (hi == lo):
                  return 0.0
              v = (x - lo) / (hi - lo)
              if not isfinite(v):
                  return 0.0
              v = 1.0 - v if invert else v
              if v < 0: v = 0.0
              if v > 1: v = 1.0
              return v

          # 3) compute scores and upsert in chunks
          batch: List[Dict] = []
          total = 0
          for rec in rows:
              d  = rec.get("droprate")
              rk = rec.get("salesrank")
              rv = rec.get("reviewcount")
              rt = rec.get("rating")

              n_drop = norm(d,  min_drop, max_drop, invert=False, fallback=0.0)
              n_rank = norm(rk, min_rank, max_rank, invert=True,  fallback=max_rank if max_rank is not None else 0.0)
              n_rev  = norm(rv, min_rev,  max_rev,  invert=False, fallback=0.0)
              n_rt   = norm(rt, min_rt,   max_rt,   invert=False, fallback=0.0)

              score = round(100.0 * (0.40*n_drop + 0.30*n_rank + 0.20*n_rev + 0.10*n_rt), 1)
              batch.append({"asin": rec["id"] if "id" in rec else rec["asin"], "score": score})

              if len(batch) >= 500:
                  supa.table("products").upsert(batch, on_conflict="asin").execute()
                  total += len(batch)
                  batch.clear()

          if batch:
              supa.table("products").upsert(batch, on_conflict="asin").execute()
              total += len(batch)

          print(f"updated scores: {total}")
          PY
