name: Keepa → Supabase sync

on:
  workflow_dispatch: {}
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dateutil psycopg2-binary supabase

      # ========= 1) ASIN収集 =========
      # プロテイン（既存）
      - name: Run fetch_keepa.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa.py

      # サプリ（途中再開・制限付き）
      - name: Download supplement checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: asins-supplements-jp
          path: data
        continue-on-error: true

      - name: Run fetch_keepa_supplement.py (resume friendly)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          # 例：日本。他国は --market us/uk/de 等に変更で流用可
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages 300 \
            --max-minutes 45 \
            --checkpoint data/asins_supplements_jp.json \
            --min-rating 3.8 \
            --min-reviews 40

      - name: Upload supplement checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: asins-supplements-jp
          path: data/asins_supplements_jp.json
          if-no-files-found: ignore

      # ========= 2) 詳細データ作成（再開対応） =========
      # 既存進捗の復元
      - name: Download details checkpoint (if exists)
        uses: actions/download-artifact@v4
        with:
          name: details-progress
          path: data
        continue-on-error: true

      - name: Build product_details.json from ASIN list
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          # --- プロテイン詳細（再開対応版を想定：引数対応）
          #   product_asins.json は fetch_keepa.py が生成する想定
          python scripts/fetch_product_details.py \
            --market jp \
            --asin-file data/product_asins.json \
            --out product_details.json \
            --checkpoint data/details_progress.json \
            --max-asins 600 \
            --max-minutes 40 \
            --batch-size 100

          # --- サプリ詳細（さっき渡した再開対応版）
          #   supplement_asins.json は fetch_keepa_supplement.py が生成する想定
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file data/supplement_asins.json \
            --out supplement_product_details.json \
            --checkpoint data/supplement_details_progress.json \
            --max-asins 600 \
            --max-minutes 40 \
            --batch-size 100

          ls -la

      - name: Upload details checkpoint
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: details-progress
          path: |
            data/details_progress.json
            data/supplement_details_progress.json
          if-no-files-found: ignore

      # ========= 3) Supabase 取り込み =========
      - name: Run import_to_Supabase.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/import_to_Supabase.py
