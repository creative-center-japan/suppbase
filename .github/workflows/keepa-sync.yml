name: Keepa to Supabase sync

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages for /deal"
        required: false
        default: "250"
      max_minutes:
        description: "Max minutes per scrape job"
        required: false
        default: "60"
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  MAX_PAGES: ${{ inputs.max_pages || '250' }}
  MAX_MINUTES: ${{ inputs.max_minutes || '60' }}

jobs:
  protein:
    name: Scrape Protein deals & details
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Prepare data dir
        run: mkdir -p data

      - name: Run fetch_filtered_deals.py (protein /deal → ASIN + priceDrops)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_filtered_deals.py

      - name: Build protein details (product stats/rating)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LIST_FILE: protein_asins_deals_filtered.json
          OUT_PRODUCT: product_details.json
        run: |
          python scripts/fetch_product_details.py

      - name: Upload artifacts (protein)
        uses: actions/upload-artifact@v4
        with:
          name: protein-json
          path: |
            protein_asins_deals_filtered.json
            product_details.json
            data/deal_price_drops_protein.json
          if-no-files-found: warn

  supplements:
    name: Scrape Supplements deals & details
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Prepare data dir
        run: mkdir -p data

      - name: Resume-able fetch_keepa_supplement.py (ASIN + priceDrops)
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_keepa_supplement.py \
            --market jp \
            --max-pages $MAX_PAGES \
            --max-minutes $MAX_MINUTES \
            --checkpoint data/asins_supplements_jp.json \
            --min-rating 3.8 \
            --min-reviews 40

      - name: Build supplement details
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_supplement_product_details.py \
            --market jp \
            --asin-file data/asins_supplements_jp.json \
            --out supplement_product_details.json \
            --max-asins 800 \
            --max-minutes $MAX_MINUTES

      - name: Upload artifacts (supplements)
        uses: actions/upload-artifact@v4
        with:
          name: supplement-json
          path: |
            data/asins_supplements_jp.json
            data/deal_price_drops_supplements.json
            supplement_product_details.json
          if-no-files-found: warn

  import-and-score:
    name: Import to Supabase & update score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [protein, supplements]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install supabase

      - name: Download protein artifacts
        uses: actions/download-artifact@v4
        with:
          name: protein-json
          path: .

      - name: Download supplement artifacts
        uses: actions/download-artifact@v4
        with:
          name: supplement-json
          path: .

      - name: Show files (debug)
        run: |
          set -euxo pipefail
          echo "== pwd ==" && pwd
          echo "== repo root ==" && ls -al
          echo "== scripts dir ==" && (ls -al scripts || true)
          echo "== data dir ==" && (ls -al data || true)

      - name: Import to Supabase (UPSERT + droprate=priceDrops + diff)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python scripts/import_to_Supabase.py

      - name: Write SQL (schema + score update + 30d views)
        run: |
          set -euxo pipefail
          cat > update_score.sql <<'SQL'
          set client_min_messages = warning;
          set search_path to public;
          create extension if not exists pg_trgm;

          create table if not exists products (
            asin           text primary key,
            title          text not null,
            brand          text,
            buyboxprice    integer,
            buyboxfallback integer,
            salesrank      integer,
            droprate       numeric,
            droprateprev   numeric,
            imageurl       text,
            rating         numeric,
            reviewcount    integer,
            score          numeric,
            updated_at     timestamptz not null default now()
          );

          alter table products add column if not exists rating numeric;
          alter table products add column if not exists reviewcount integer;
          alter table products add column if not exists score numeric;
          alter table products add column if not exists updated_at timestamptz not null default now();

          create index if not exists idx_products_updated_at on products(updated_at desc);
          create index if not exists idx_products_title_trgm on products using gin (title gin_trgm_ops);

          with stats as (
            select
              min(droprate)    as min_drop, max(droprate)    as max_drop,
              min(salesrank)   as min_rank, max(salesrank)   as max_rank,
              min(reviewcount) as min_rev,  max(reviewcount) as max_rev,
              min(rating)      as min_rt,   max(rating)      as max_rt
            from products
          ),
          normed as (
            select
              p.asin,
              case when s.max_drop>s.min_drop then (p.droprate    - s.min_drop)/(s.max_drop-s.min_drop) else 0 end as n_drop,
              case when s.max_rank>s.min_rank then 1-(coalesce(p.salesrank, s.max_rank) - s.min_rank)/(s.max_rank-s.min_rank) else 0 end as n_rank,
              case when s.max_rev>s.min_rev   then (coalesce(p.reviewcount,0) - s.min_rev)/(s.max_rev - s.min_rev) else 0 end as n_rev,
              case when s.max_rt>s.min_rt     then (coalesce(p.rating,0)     - s.min_rt)/(s.max_rt - s.min_rt) else 0 end as n_rt
            from products p cross join stats s
          )
          update products p
          set score = round(
            100*(0.40*coalesce(n.n_drop,0)
               +0.30*coalesce(n.n_rank,0)
               +0.20*coalesce(n.n_rev ,0)
               +0.10*coalesce(n.n_rt  ,0)), 1)
          from normed n
          where p.asin = n.asin;

          drop view if exists v_products_recent_30d cascade;
          create view v_products_recent_30d as
          select * from products
          where updated_at >= now() - interval '30 days';

          drop view if exists v_rank_whey_30d cascade;
          create view v_rank_whey_30d as
          select *
          from v_products_recent_30d
          where (title ilike '%ホエイ%' or title ilike '%whey%')
            and not (title ilike '%WPI%' or title ilike '%アイソレート%' or title ilike '%isolate%');

          drop view if exists v_rank_wpi_30d cascade;
          create view v_rank_wpi_30d as
          select *
          from v_products_recent_30d
          where (title ilike '%WPI%' or title ilike '%アイソレート%' or title ilike '%isolate%');
          SQL
          head -n 60 update_score.sql

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Debug DB connection
        env:
          SUPABASE_DB_URL_DIRECT: ${{ secrets.SUPABASE_DB_URL_DIRECT }}
        run: |
          set -euxo pipefail
          psql --version
          psql "${SUPABASE_DB_URL_DIRECT}" -c '\conninfo'

      - name: Run SQL on Supabase
        env:
          SUPABASE_DB_URL_DIRECT: ${{ secrets.SUPABASE_DB_URL_DIRECT }}
        run: |
          set -euxo pipefail
          psql "${SUPABASE_DB_URL_DIRECT}" -v ON_ERROR_STOP=1 -f update_score.sql
