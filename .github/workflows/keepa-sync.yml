name: Keepa to Supabase sync

on:
  workflow_dispatch:
  schedule:
    # JST 02:00（UTC 17:00）
    - cron: "0 17 * * *"

concurrency:
  group: keepa-supabase-sync
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  update-products:
    name: Update products via Keepa (/product only)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "supabase>=2.4.0" requests

      - name: Export ASINs from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python - <<'PY'
          import os, json
          from supabase import create_client

          supa = create_client(
              os.environ["SUPABASE_URL"],
              os.environ["SUPABASE_SERVICE_ROLE"]
          )

          res = supa.table("tracked_asins") \
              .select("asin") \
              .eq("is_active", True) \
              .execute()

          asins = [r["asin"] for r in (res.data or [])]

          with open("asins.json", "w", encoding="utf-8") as f:
              json.dump(asins, f, ensure_ascii=False)

          print(f"exported {len(asins)} ASINs")
          PY

      - name: Fetch product details from Keepa
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LIST_FILE: asins.json
          OUT_PRODUCT: product_details.json
        run: |
          python scripts/fetch_product_details.py

      - name: Import to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          python scripts/import_to_Supabase.py
