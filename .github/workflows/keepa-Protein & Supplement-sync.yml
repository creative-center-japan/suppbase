name: Keepa Sync (Protein & Supplement)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests supabase

      # =========================
      # Protein (Whey)
      # =========================
      - name: Fetch Whey Protein Best Sellers ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_PROTEIN }}
          OUT_FILE: asins_protein.json

      - name: Fetch Whey Protein product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_FILE: asins_protein.json
          OUT_FILE: product_details.json

      - name: Import Whey Protein to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

      # =========================
      # Protein (Soy)
      # =========================
      - name: Fetch Soy Protein Best Sellers ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_PROTEIN_SOY }}
          OUT_FILE: asins_protein_soy.json

      - name: Fetch Soy Protein product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_FILE: asins_protein_soy.json
          OUT_FILE: product_details_soy.json

      - name: Import Soy Protein to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

      # =========================
      # Supplement (BCAA)
      # =========================
      - name: Fetch BCAA Best Sellers ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_SUPPLEMENT }}
          OUT_FILE: asins_supplement.json

      - name: Fetch BCAA product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_FILE: asins_supplement.json
          OUT_FILE: supplement_product_details.json

      - name: Import BCAA to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
