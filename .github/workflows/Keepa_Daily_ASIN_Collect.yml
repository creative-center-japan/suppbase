name: Keepa Daily ASIN Collect

on:
  schedule:
    - cron: "0 3 * * *"   # 毎日03:00 JST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests supabase

      # ---- Whey ----
      - name: Fetch Whey ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_PROTEIN }}
          OUT_FILE: asins_whey.json

      - name: Register Whey ASINs
        run: python scripts/import_asins_to_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ASIN_FILE: asins_whey.json
          CATEGORY: whey

      # ---- Soy ----
      - name: Fetch Soy ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_PROTEIN_SOY }}
          OUT_FILE: asins_soy.json

      - name: Register Soy ASINs
        run: python scripts/import_asins_to_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ASIN_FILE: asins_soy.json
          CATEGORY: soy

      # ---- BCAA ----
      - name: Fetch BCAA ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_SUPPLEMENT }}
          OUT_FILE: asins_bcaa.json

      - name: Register BCAA ASINs
        run: python scripts/import_asins_to_supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ASIN_FILE: asins_bcaa.json
          CATEGORY: bcaa
