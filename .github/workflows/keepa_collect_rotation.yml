name: Keepa Collect Rotation

on:
  schedule:
    # 1日4回（Plan20前提・安全）
    # JST: 03:00 / 09:00 / 15:00 / 21:00
    - cron: "0 18 * * *"   # 03:00 JST
    - cron: "0 0 * * *"    # 09:00 JST
    - cron: "0 6 * * *"    # 15:00 JST
    - cron: "0 12 * * *"   # 21:00 JST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ① リポジトリ取得
      - name: Checkout repository
        uses: actions/checkout@v4

      # ② Python セットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ③ 依存関係インストール（← 今回の詰まりポイント）
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ④ データ取得 & 保存
      - name: Fetch product details from Supabase & Keepa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          MAX_PER_RUN: "70"
        run: |
          python scripts/fetch_product_details_from_supabase.py
