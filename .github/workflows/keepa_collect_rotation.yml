name: Keepa Collect (Category Rotation)

on:
  schedule:
    # 毎日 JST 04:00（UTC 19:00）
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Run Keepa collector (rotating category)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

          # 1回の実行で使う最大トークン数（Plan20前提の安全値）
          MAX_PER_RUN: "300"

        run: |
          python fetch_product_details_from_supabase.py
