name: Keepa Collect Rotation (Plan20)

on:
  schedule:
    # 10分ごとに実行
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Decide category by minute
        id: category
        run: |
          MIN=$(date +'%M')
          MOD=$((10#$MIN / 10))

          if [ "$MOD" -eq 0 ] || [ "$MOD" -eq 4 ]; then
            echo "CATEGORY=whey" >> $GITHUB_OUTPUT
          elif [ "$MOD" -eq 1 ] || [ "$MOD" -eq 5 ]; then
            echo "CATEGORY=soy" >> $GITHUB_OUTPUT
          elif [ "$MOD" -eq 2 ]; then
            echo "CATEGORY=isolate" >> $GITHUB_OUTPUT
          else
            echo "CATEGORY=supplement" >> $GITHUB_OUTPUT
          fi

      - name: Fetch product details from Keepa
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          TARGET_CATEGORY: ${{ steps.category.outputs.CATEGORY }}
          MAX_PER_RUN: "15"
        run: |
          python scripts/fetch_product_details_from_supabase.py
