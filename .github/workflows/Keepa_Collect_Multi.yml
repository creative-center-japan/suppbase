name: Keepa Collect Multi

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set ENV
        run: |
          echo "MAX_PER_RUN=4" >> $GITHUB_ENV
          echo "MAX_JP=2" >> $GITHUB_ENV
          echo "MAX_US=2" >> $GITHUB_ENV
          echo "MAX_UK=0" >> $GITHUB_ENV

      - name: Run multi collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: |
          python scripts/fetch_product_details_from_supabase_multi.py