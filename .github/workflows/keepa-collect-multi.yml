name: Keepa Collect Multi

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"   # 09:30 JST
    - cron: "30 12 * * *"  # 21:30 JST

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set ENV
        run: |
          echo "LOCALES=us" >> $GITHUB_ENV
          echo "ORDER_ASC=false" >> $GITHUB_ENV
          echo "BATCH_SIZE=20" >> $GITHUB_ENV
          echo "KEEPA_CHUNK_SIZE=10" >> $GITHUB_ENV
          echo "ONLY_ACTIVE=true" >> $GITHUB_ENV
          echo "SLEEP_SEC=3" >> $GITHUB_ENV

      - name: Run multi collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          LOCALES: ${{ env.LOCALES }}
          ORDER_ASC: ${{ env.ORDER_ASC }}
          BATCH_SIZE: ${{ env.BATCH_SIZE }}
          KEEPA_CHUNK_SIZE: ${{ env.KEEPA_CHUNK_SIZE }}
          ONLY_ACTIVE: ${{ env.ONLY_ACTIVE }}
          SLEEP_SEC: ${{ env.SLEEP_SEC }}
        run: |
          python scripts/fetch_product_details_from_supabase_multi.py