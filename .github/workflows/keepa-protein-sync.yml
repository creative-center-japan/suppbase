name: Keepa Protein Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests supabase

      # =========================
      # ① Keepa Product Finder
      # =========================
      - name: Fetch ranking ASINs
        run: python scripts/fetch_ranking_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      # =========================
      # ② Products API（表示用）
      # =========================
      - name: Fetch product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      # =========================
      # ③ Tracking 登録
      # =========================
      - name: Add tracking products
        run: python scripts/add_tracking.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      # =========================
      # ④ Supabase 保存
      # =========================
      - name: Import to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
