name: Keepa Protein Sync

on:
  workflow_dispatch:
  schedule:
    # 6時間おき（UTC）
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ★ 長時間は禁止

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install requests supabase

      - name: Export ASINs (protein)
        run: python scripts/export_asins.py protein 100
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      - name: Fetch protein details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      - name: Import to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
