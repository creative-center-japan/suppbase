name: Keepa Sync (Protein & Supplement)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests supabase

      # =========================
      # Protein
      # =========================
      - name: Fetch Protein Best Sellers ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_PROTEIN }}
          OUT_FILE: asins_protein.json

      - name: Fetch Protein product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_FILE: asins_protein.json
          OUT_FILE: product_details.json

      - name: Import Protein to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

      # =========================
      # Supplement
      # =========================
      - name: Fetch Supplement Best Sellers ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID_SUPPLEMENT }}
          OUT_FILE: asins_supplement.json

      - name: Fetch Supplement product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_FILE: asins_supplement.json
          OUT_FILE: supplement_product_details.json

      - name: Import Supplement to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
