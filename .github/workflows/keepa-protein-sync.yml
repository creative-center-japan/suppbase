name: Keepa Protein Sync

on:
  workflow_dispatch:
  schedule:
    # 6時間おき（UTC）
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests supabase

      # =========================
      # ① Supabase → ASIN 抽出
      # =========================
      - name: Export ASINs (protein)
        run: python scripts/export_asins.py protein 100
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}

      # =========================
      # ② Keepa Product API（省token）
      # =========================
      - name: Fetch protein product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      # =========================
      # ③ Supabase へ保存
      # =========================
      - name: Import to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
