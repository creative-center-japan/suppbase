name: Keepa Protein Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests supabase

      # 任意：カテゴリ候補をログ出し（普段はOFFでもOK）
      # - name: Fetch category candidates
      #   run: python scripts/fetch_categories.py
      #   env:
      #     KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
      #     CATEGORY_TERM: "プロテイン"

      - name: Fetch Best Sellers ASINs
        run: python scripts/fetch_best_sellers_asins.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          CATEGORY_ID: ${{ secrets.CATEGORY_ID }}

      - name: Fetch product details
        run: python scripts/fetch_product_details.py
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}

      - name: Import to Supabase
        run: python scripts/import_to_Supabase.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
