name: Fetch Bestseller ASINs All

on:
   schedule:
     - cron: "0 18 * * *"   # 03:00 JST
     - cron: "0 6 * * 1,4"  # 15:00 JST Mon/Thu などでもOK

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch JP Whey bestseller ASINs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LOCALE: jp
          ASIN_CATEGORY: protein
          CATEGORY_ID: 3457072051
          ASIN_SOURCE: bestseller
          TOP_N: 100
          MAX_INSERT: 100
          SLEEP_SEC: 1
        run: |
          python scripts/fetch_bestseller_asins_to_supabase.py

      - name: Fetch JP Soy bestseller ASINs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LOCALE: jp
          ASIN_CATEGORY: protein
          CATEGORY_ID: 3457071051
          ASIN_SOURCE: bestseller
          TOP_N: 100
          MAX_INSERT: 100
          SLEEP_SEC: 1
        run: |
          python scripts/fetch_bestseller_asins_to_supabase.py

      - name: Fetch JP BCAA bestseller ASINs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LOCALE: jp
          ASIN_CATEGORY: supplement
          CATEGORY_ID: 3457012051
          ASIN_SOURCE: bestseller
          TOP_N: 100
          MAX_INSERT: 100
          SLEEP_SEC: 1
        run: |
          python scripts/fetch_bestseller_asins_to_supabase.py

      - name: Fetch US Whey bestseller ASINs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LOCALE: us
          ASIN_CATEGORY: protein
          CATEGORY_ID: 6973717011
          ASIN_SOURCE: bestseller
          TOP_N: 100
          MAX_INSERT: 100
          SLEEP_SEC: 1
        run: |
          python scripts/fetch_bestseller_asins_to_supabase.py

      - name: Fetch US Soy bestseller ASINs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LOCALE: us
          ASIN_CATEGORY: protein
          CATEGORY_ID: 6973716011
          ASIN_SOURCE: bestseller
          TOP_N: 100
          MAX_INSERT: 100
          SLEEP_SEC: 1
        run: |
          python scripts/fetch_bestseller_asins_to_supabase.py

      - name: Fetch UK Whey bestseller ASINs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          ASIN_LOCALE: uk
          ASIN_CATEGORY: protein
          CATEGORY_ID: 5977836031
          ASIN_SOURCE: bestseller
          TOP_N: 100
          MAX_INSERT: 100
          SLEEP_SEC: 1
        run: |
          python scripts/fetch_bestseller_asins_to_supabase.py